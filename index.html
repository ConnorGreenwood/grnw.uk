<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workspace Launcher</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      overflow-x: hidden;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f5f2;
      color: #111;
    }

    .ambient-bg {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, #f8f7f3 0%, #eef2f7 52%, #f8f7f3 100%);
    }

    .ambient-bg::before,
    .ambient-bg::after {
      content: "";
      position: absolute;
      left: -15%;
      right: -15%;
      height: 42%;
      border-radius: 50%;
      filter: blur(42px);
      opacity: 0.55;
      transform-origin: center;
    }

    .ambient-bg::before {
      top: 8%;
      background: linear-gradient(90deg, transparent, rgba(147,197,253,0.55), rgba(196,181,253,0.4), transparent);
      animation: auroraWaveOne 20s ease-in-out infinite alternate;
    }

    .ambient-bg::after {
      bottom: 3%;
      background: linear-gradient(90deg, transparent, rgba(167,243,208,0.45), rgba(253,186,116,0.24), transparent);
      animation: auroraWaveTwo 26s ease-in-out infinite alternate;
    }

    .orb {
      display: none;
    }

    @keyframes auroraWaveOne {
      0% {
        transform: translate3d(-4%, 0, 0) rotate(-4deg) scale(1);
      }
      100% {
        transform: translate3d(6%, 28px, 0) rotate(4deg) scale(1.08);
      }
    }

    @keyframes auroraWaveTwo {
      0% {
        transform: translate3d(5%, 0, 0) rotate(3deg) scale(1.04);
      }
      100% {
        transform: translate3d(-6%, -24px, 0) rotate(-3deg) scale(1);
      }
    }

    .page {
      position: relative;
      z-index: 2;
      max-width: 1280px;
      margin: 0 auto;
      padding: 40px 24px;
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 28px;
      align-items: flex-start;
      margin-bottom: 32px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.75);
      border: 1px solid #e6e2da;
      box-shadow: 0 8px 30px rgba(0,0,0,0.04);
      color: #666;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #10b981;
    }

    h1 {
      font-size: clamp(42px, 7vw, 76px);
      line-height: 0.95;
      letter-spacing: -0.06em;
      font-weight: 720;
    }

    .actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .search-wrap {
      position: relative;
    }

    .search-wrap span {
      position: absolute;
      top: 50%;
      left: 15px;
      transform: translateY(-50%);
      color: #999;
    }

    input, select {
      height: 46px;
      border: 1px solid #e4e0d8;
      background: white;
      border-radius: 18px;
      padding: 0 16px;
      font: inherit;
      outline: none;
      transition: 0.2s ease;
    }

    input:focus, select:focus {
      border-color: #111;
    }

    #search {
      width: 290px;
      padding-left: 42px;
    }

    button {
      border: 0;
      cursor: pointer;
      font: inherit;
    }

    .primary-btn {
      height: 46px;
      border-radius: 18px;
      padding: 0 18px;
      color: white;
      background: #111;
      transition: 0.2s ease;
    }

    .primary-btn:hover {
      transform: translateY(-1px);
      background: #262626;
    }

    .tabs {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      margin-bottom: 34px;
      padding-bottom: 4px;
    }

    .tab {
      white-space: nowrap;
      border-radius: 18px;
      padding: 10px 16px;
      background: white;
      color: #666;
      box-shadow: 0 8px 28px rgba(0,0,0,0.04);
      transition: 0.2s ease;
    }

    .tab.active {
      background: #111;
      color: white;
    }

    .section {
      margin-bottom: 44px;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .section-head h2 {
      font-size: 22px;
      letter-spacing: -0.03em;
    }

    .section-head p {
      color: #777;
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }

    .card {
      display: block;
      color: inherit;
      text-decoration: none;
      background: white;
      border-radius: 28px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.045);
      transition: 0.22s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 24px 60px rgba(0,0,0,0.11);
    }

    .hero {
      height: 96px;
      border-radius: 22px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      color: white;
      margin-bottom: 18px;
      background: linear-gradient(135deg, #525252, #111);
    }

    .app-icon {
      height: 50px;
      min-width: 50px;
      padding: 0 10px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: rgba(255,255,255,0.22);
      font-weight: 800;
      backdrop-filter: blur(10px);
    }

    .fav {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      color: white;
      background: rgba(255,255,255,0.18);
      backdrop-filter: blur(10px);
    }

    .fav.active {
      background: rgba(255,255,255,0.32);
    }

    .card-bottom {
      display: block;
    }

    .card h3 {
      font-size: 19px;
      margin-bottom: 5px;
    }

    .card p {
      color: #707070;
      font-size: 14px;
      line-height: 1.35;
    }


    .modal-backdrop {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0,0,0,0.42);
      backdrop-filter: blur(8px);
      z-index: 10;
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal {
      width: min(440px, 100%);
      background: white;
      border-radius: 30px;
      padding: 22px;
      box-shadow: 0 30px 90px rgba(0,0,0,0.28);
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .close-btn {
      width: 36px;
      height: 36px;
      border-radius: 999px;
      background: #f3f3f3;
      color: #555;
    }

    .form {
      display: grid;
      gap: 12px;
    }

    .form input {
      width: 100%;
      height: 50px;
    }

    .form .primary-btn {
      height: 50px;
      margin-top: 4px;
    }

    .small-note {
      margin-top: 14px;
      text-align: center;
      color: #777;
      font-size: 12px;
      line-height: 1.4;
    }

    @media (max-width: 980px) {
      header {
        flex-direction: column;
      }

      .actions {
        width: 100%;
      }

      .search-wrap, #search {
        width: 100%;
      }

      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 560px) {
      .page {
        padding: 24px 16px;
      }

      .actions {
        flex-direction: column;
      }

      .primary-btn {
        width: 100%;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="ambient-bg">
    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="orb three"></div>
    <div class="orb four"></div>
  </div>
  <div class="page">
    <header>
      <div>
        <div class="badge"><span class="badge-dot"></span> Workspace launcher</div>
        <h1>Everything you need,<br />one click away.</h1>
      </div>

      <div class="actions">
        <div class="search-wrap">
          <span>⌕</span>
          <input id="search" type="search" placeholder="Search apps..." />
        </div>
        
      </div>
    </header>

    <nav class="tabs" id="tabs"></nav>
    <main id="appSections"></main>
  </div>

  

  <script>
    const defaultApps = [
      { name: "Teams", category: "Microsoft 365", url: "https://teams.microsoft.com/", icon: "T", gradient: "#6366f1, #7c3aed", description: "Chat, meetings and collaboration" },
      { name: "Outlook", category: "Microsoft 365", url: "https://outlook.office.com/", icon: "O", gradient: "#3b82f6, #0284c7", description: "Email and calendar" },
      { name: "Word", category: "Microsoft 365", url: "https://www.office.com/launch/word", icon: "W", gradient: "#2563eb, #1e3a8a", description: "Documents and writing" },
      { name: "Excel", category: "Microsoft 365", url: "https://www.office.com/launch/excel", icon: "X", gradient: "#10b981, #15803d", description: "Spreadsheets and analysis" },
      { name: "PowerPoint", category: "Microsoft 365", url: "https://www.office.com/launch/powerpoint", icon: "P", gradient: "#f97316, #dc2626", description: "Slides and presentations" },
      { name: "OneDrive", category: "Microsoft 365", url: "https://onedrive.live.com/", icon: "1D", gradient: "#38bdf8, #2563eb", description: "Files and cloud storage" },
      { name: "OneNote", category: "Microsoft 365", url: "https://www.onenote.com/", icon: "N", gradient: "#a855f7, #a21caf", description: "Notes and notebooks" },
      { name: "SharePoint", category: "Microsoft 365", url: "https://www.office.com/launch/sharepoint", icon: "S", gradient: "#14b8a6, #0e7490", description: "Sites and shared resources" },
      { name: "YouTube", category: "Streaming", url: "https://www.youtube.com/", icon: "YT", gradient: "#ef4444, #b91c1c", description: "Videos, channels and creators" },
      { name: "Netflix", category: "Streaming", url: "https://www.netflix.com/", icon: "N", gradient: "#b91c1c, #111111", description: "Movies and series" },
      { name: "Prime Video", category: "Streaming", url: "https://www.primevideo.com/", icon: "PV", gradient: "#0ea5e9, #1e3a8a", description: "Amazon streaming" },
      { name: "Twitch", category: "Streaming", url: "https://www.twitch.tv/", icon: "TW", gradient: "#8b5cf6, #6d28d9", description: "Live streams and gaming" },
      { name: "Hulu", category: "Streaming", url: "https://www.hulu.com/", icon: "H", gradient: "#a3e635, #15803d", description: "Shows and live TV" },
      { name: "Disney+", category: "Streaming", url: "https://www.disneyplus.com/", icon: "D+", gradient: "#1d4ed8, #172554", description: "Disney, Marvel and Star Wars" },
      { name: "BBC iPlayer", category: "Streaming", url: "https://www.bbc.co.uk/iplayer", icon: "BBC", gradient: "#ec4899, #be123c", description: "BBC programmes and live TV" },
      { name: "ITVX", category: "Streaming", url: "https://www.itv.com/", icon: "ITV", gradient: "#22d3ee, #1d4ed8", description: "ITV shows and live TV" },

      { name: "Roblox", category: "Gaming", url: "https://www.roblox.com/", icon: "RB", gradient: "#111111, #525252", description: "Games, worlds and creators" },
      { name: "Xbox Cloud Gaming", category: "Gaming", url: "https://www.xbox.com/play", icon: "XB", gradient: "#22c55e, #15803d", description: "Play Xbox games in the cloud" },
      { name: "Minecraft", category: "Gaming", url: "https://www.minecraft.net/", icon: "MC", gradient: "#16a34a, #854d0e", description: "Build, explore and survive" },
      { name: "Epic Games", category: "Gaming", url: "https://store.epicgames.com/", icon: "EP", gradient: "#18181b, #3f3f46", description: "Games store and free games" },
      { name: "Steam", category: "Gaming", url: "https://store.steampowered.com/", icon: "ST", gradient: "#0f172a, #0369a1", description: "PC games and community" },
      { name: "NVIDIA GeForce NOW", category: "Gaming", url: "https://www.nvidia.com/en-gb/geforce-now/", icon: "GN", gradient: "#76b900, #14532d", description: "Cloud gaming with GeForce" },
      { name: "PlayStation", category: "Gaming", url: "https://www.playstation.com/", icon: "PS", gradient: "#2563eb, #1e1b4b", description: "PlayStation games and services" },
      { name: "Nintendo", category: "Gaming", url: "https://www.nintendo.com/", icon: "N", gradient: "#ef4444, #991b1b", description: "Nintendo games and news" },

      { name: "ChatGPT", category: "AI", url: "https://chatgpt.com/", icon: "GPT", gradient: "#10a37f, #064e3b", description: "AI assistant for writing and ideas" },
      { name: "Microsoft Copilot", category: "AI", url: "https://copilot.microsoft.com/", icon: "CP", gradient: "#06b6d4, #2563eb", description: "Microsoft AI assistant" },
      { name: "Google Gemini", category: "AI", url: "https://gemini.google.com/", icon: "GM", gradient: "#4285f4, #9333ea", description: "Google AI assistant" },
      { name: "Claude", category: "AI", url: "https://claude.ai/", icon: "CL", gradient: "#d97706, #7c2d12", description: "AI assistant for thinking and writing" },
      { name: "Perplexity", category: "AI", url: "https://www.perplexity.ai/", icon: "PX", gradient: "#14b8a6, #0f766e", description: "AI search and answers" },
      { name: "Canva", category: "AI", url: "https://www.canva.com/", icon: "CV", gradient: "#00c4cc, #7c3aed", description: "Design, graphics and AI tools" },

      { name: "Google", category: "Popular", url: "https://www.google.com/", icon: "G", gradient: "#4285f4, #34a853", description: "Search the web" },
      { name: "Wikipedia", category: "Popular", url: "https://www.wikipedia.org/", icon: "W", gradient: "#525252, #171717", description: "Free online encyclopedia" },
      { name: "Reddit", category: "Popular", url: "https://www.reddit.com/", icon: "RD", gradient: "#ff4500, #991b1b", description: "Communities and discussions" },
      { name: "GitHub", category: "Popular", url: "https://github.com/", icon: "GH", gradient: "#24292f, #000000", description: "Code, projects and repositories" },
      { name: "Amazon", category: "Popular", url: "https://www.amazon.co.uk/", icon: "AZ", gradient: "#f59e0b, #111827", description: "Shopping and services" },
      { name: "Gmail", category: "Popular", url: "https://mail.google.com/", icon: "GM", gradient: "#ef4444, #f59e0b", description: "Google email" }
    ];

    let apps = JSON.parse(localStorage.getItem("launcherApps")) || defaultApps;
    let favourites = JSON.parse(localStorage.getItem("launcherFavourites")) || ["Teams", "Outlook", "YouTube"];
    let activeCategory = "All";

    const tabs = document.getElementById("tabs");
    const appSections = document.getElementById("appSections");
    const search = document.getElementById("search");
    const modal = document.getElementById("modal");

    function categories() {
      return ["All", "Microsoft 365", "Streaming", "Favourites", ...new Set(apps.map(app => app.category).filter(category => !["Microsoft 365", "Streaming"].includes(category)))]
    }

    function save() {
      localStorage.setItem("launcherApps", JSON.stringify(apps));
      localStorage.setItem("launcherFavourites", JSON.stringify(favourites));
    }

    function renderTabs() {
      tabs.innerHTML = categories().map(category => `
        <button class="tab ${activeCategory === category ? "active" : ""}" data-category="${category}">${category}</button>
      `).join("");

      document.querySelectorAll(".tab").forEach(tab => {
        tab.addEventListener("click", () => {
          activeCategory = tab.dataset.category;
          render();
        });
      });
    }

    function getFilteredApps() {
      const term = search.value.toLowerCase();
      return apps.filter(app => {
        const matchesSearch = `${app.name} ${app.category} ${app.description}`.toLowerCase().includes(term);
        const matchesCategory = activeCategory === "All" || app.category === activeCategory || (activeCategory === "Favourites" && favourites.includes(app.name));
        return matchesSearch && matchesCategory;
      });
    }

    function groupApps(items) {
      return items.reduce((groups, app) => {
        const group = activeCategory === "All" || activeCategory === "Favourites" ? app.category : activeCategory;
        groups[group] = groups[group] || [];
        groups[group].push(app);
        return groups;
      }, {});
    }

    function renderApps() {
      const groups = groupApps(getFilteredApps());
      appSections.innerHTML = Object.entries(groups).map(([category, categoryApps]) => `
        <section class="section">
          <div class="section-head">
            <h2>${category}</h2>
            <p>${categoryApps.length} apps</p>
          </div>
          <div class="grid">
            ${categoryApps.map(app => `
              <a class="card" href="${app.url}" target="_blank" rel="noopener noreferrer">
                <div class="hero" style="background: linear-gradient(135deg, ${app.gradient});">
                  <div class="app-icon">${app.icon}</div>
                  <button class="fav ${favourites.includes(app.name) ? "active" : ""}" data-fav="${app.name}" type="button">★</button>
                </div>
                <div class="card-bottom">
                  <div>
                    <h3>${app.name}</h3>
                    <p>${app.description}</p>
                  </div>
                </div>
              </a>
            `).join("")}
          </div>
        </section>
      `).join("") || `<p>No apps found.</p>`;

      document.querySelectorAll("[data-fav]").forEach(button => {
        button.addEventListener("click", (event) => {
          event.preventDefault();
          event.stopPropagation();
          const name = button.dataset.fav;
          favourites = favourites.includes(name) ? favourites.filter(item => item !== name) : [...favourites, name];
          save();
          render();
        });
      });
    }

    function render() {
      renderTabs();
      renderApps();
    }

    

    render();
  </script>
</body>
</html>
